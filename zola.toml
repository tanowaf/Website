# The website configuration file.
#
# It overrides settings from the theme (themes/devlab-theme/theme.toml).
#
# An example of all the settings which can be used to configure the site, including theme-specific ones, can be found
# in themes/devlab-theme/zola.toml

base_url = "https://tanowaf.org"
title = "Tano WAF"

#description =
#author =

theme = "devlab-theme"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

#minify_html = true
#generate_feeds = true

[markdown]
#render_emoji = true
#insert_anchor_links = "right"

[markdown.highlighting]
#theme = "catppuccin-mocha"
light_theme = "github-light"
dark_theme = "github-dark"
#error_on_missing_language = true

[search]
index_format = "elasticlunr_javascript"
include_title = true
include_description = true
include_content = true

[extra]
#home_eyebrow = "Web API Firewalls - and other assorted HTTP Proxies"
home_eyebrow = ""

[extra.devlab.brand]
logo_text = "TanoWAF"
show_logo_mark = true
logo_mark_path = "/brand/logo.png"
footer_text = "Gaetano Giunta"

[extra.devlab.footer]
show = true
#note = "Documentation maintained by the Acme team."
links_label = "Project links"
links = [
    { name = "Source", path = "https://github.com/tanowaf/waf-core", icon = "github" },
    #{ name = "Atom feed", path = "/atom.xml", icon = "rss" },
]

[extra.devlab.navigation]
links = [
    { name = "Home", path = "/" },
    #{ name = "Docs", kind = "docs" },
    { name = "Blog", kind = "blog" },
]

#[extra.devlab.docs]
#section = "docs/_index.md"
#path = "/docs/"
#get_started_path = "/docs/getting-started/"

[extra.devlab.blog]
path = "/blog/"
date_format = "%Y-%m-%d"

[extra.devlab.appearance]
default_mode = "system"
show_toggle = true

[extra.devlab.search]
enabled = true
# The empty index value selects search_index.<language>.js automatically.
index = ""
